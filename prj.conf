# Bluetooth LE peripheral with Nordic UART Service
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="BLEberry"

# Larger ATT MTU / data length for a snappier REPL (peer must request it)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Berry heap: the interpreter allocates from the libc malloc arena.
# Boards with more SRAM raise this in boards/<board>.conf.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768

# Berry prints reals via printf-family formatting
CONFIG_PICOLIBC_IO_FLOAT=y

# reboot() native function
CONFIG_REBOOT=y

CONFIG_RING_BUFFER=y

# Keep the UART console for log output; the REPL itself runs over BLE
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
